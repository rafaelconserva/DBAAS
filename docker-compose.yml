services:
  primary:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c wal_keep_size=256MB
    configs:
      - source: init_primary
        target: /docker-entrypoint-initdb.d/init-primary.sh
    volumes:
      - primary_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"

  replica:
    image: postgres:16
    user: postgres
    depends_on:
      - primary
    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          until PGPASSWORD=repl pg_basebackup -h primary -U replicator -D "$$PGDATA" -R -X stream -C -S replica1_slot; do
            sleep 2
          done
          chmod 700 "$$PGDATA"
        fi
        exec postgres
    volumes:
      - replica_data:/var/lib/postgresql/data
    ports:
      - "5443:5432"

configs:
  init_primary:
    content: |
      #!/bin/bash
      set -e
      psql -v ON_ERROR_STOP=1 -U postgres -c "CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD 'repl';"
      echo "host replication replicator all scram-sha-256" >> "$$PGDATA/pg_hba.conf"

volumes:
  primary_data:
  replica_data: